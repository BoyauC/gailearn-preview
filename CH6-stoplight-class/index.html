<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI 三色燈挑戰班級記錄版，學生以課堂代碼加入，教師即時查看作答進度。" />
  <title>AI 三色燈挑戰｜班級版</title>
  <link rel="stylesheet" href="css/style.css?v=9" />
</head>
<body class="portal-page" data-level="basic">
  <main id="app" class="portal-shell">
    <section class="hero-card" aria-labelledby="page-title">
      <span class="eyebrow">CH6 · 班級互動版</span>
      <h1 id="page-title" class="title">AI 三色燈挑戰</h1>
      <p class="subtitle">先選擇你的身分，再開始今天的課堂。</p>

      <div class="role-grid">
        <a class="role-card role-card--student" href="student.html">
          <span class="role-icon" aria-hidden="true">🚦</span>
          <span class="role-copy">
            <strong>我是學生</strong>
            <small>輸入老師提供的 4 位數代碼，開始挑戰。</small>
          </span>
          <span class="role-arrow" aria-hidden="true">→</span>
        </a>

        <a class="role-card role-card--teacher" href="teacher.html">
          <span class="role-icon" aria-hidden="true">📋</span>
          <span class="role-copy">
            <strong>我是教師</strong>
            <small>建立新課堂，或回到既有課堂查看紀錄。</small>
          </span>
          <span class="role-arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <p class="privacy-note">學生姓名可不填；未填時系統會使用匿名編號。請勿在姓名欄輸入學號、電話或其他敏感資料。</p>
    </section>
  </main>
</body>
</html>
